name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu:
          - "22.04"
          - "24.04"

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v7

      - name: Systemabhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream build-essential debhelper desktop-file-utils gir1.2-gtk-4.0 python3-gi dbus-x11 xvfb openssl

      - name: Python- und Shell-Dateien prüfen
        run: |
          python3 -m compileall -q restlos tests scripts
          bash -n install.sh update.sh uninstall.sh scripts/build-deb.sh scripts/build-release.sh scripts/build-source-package.sh

      - name: Regressionstests ausführen
        env:
          GTK_A11Y: none
        run: dbus-run-session -- xvfb-run -a python3 -m unittest discover -s tests -v

      - name: Isolierte Installation prüfen
        run: |
          test_home="$(mktemp -d -t restlos-ci.XXXXXXXX)"
          trap 'rm -rf -- "$test_home"' EXIT
          RESTLOS_TEST_HOME="$test_home" HOME="$test_home" ./install.sh
          HOME="$test_home" "$test_home/.local/bin/restlos" --version
          RESTLOS_TEST_HOME="$test_home" HOME="$test_home" ./uninstall.sh --purge

      - name: Reproduzierbares Release bauen
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          ./scripts/build-release.sh dist
          cd dist
          sha256sum --check Restlos-*.sha256
          test -z "$(find . -type d -name __pycache__ -o -type f -name '*.pyc')"

      - name: Debian-Paket bauen und prüfen
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          ./scripts/build-deb.sh dist
          package="$(find dist -maxdepth 1 -type f -name 'restlos-uninstaller_*_all.deb' -print -quit)"
          test -n "$package"
          (cd dist && sha256sum --check "$(basename "$package").sha256")
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"

      - name: Debian-Quellpaket für Launchpad prüfen
        run: |
          dpkg-buildpackage --build=binary --no-sign
          ./scripts/build-source-package.sh noble dist/source --unsigned
          source_package="$(find dist/source -maxdepth 1 -type f -name '*.dsc' -print -quit)"
          test -n "$source_package"
          extract_root="$(mktemp -d -t restlos-source-check.XXXXXXXX)"
          dpkg-source --extract "$source_package" "$extract_root/source"

  native-adapters:
    name: ${{ matrix.name }}-Adapter
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora
            image: fedora:latest
            family: dnf
            expected_source: DNF/RPM
          - name: Arch Linux
            image: archlinux:latest
            family: pacman
            expected_source: pacman
          - name: openSUSE
            image: opensuse/tumbleweed:latest
            family: zypper
            expected_source: Zypper/RPM
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v7

      - name: Python installieren
        run: |
          case "${{ matrix.family }}" in
            dnf) dnf install --assumeyes python3 ;;
            pacman) pacman -Syu --noconfirm python ;;
            zypper) zypper --non-interactive install python3 ;;
          esac

      - name: Adapter und Regressionstests prüfen
        env:
          RESTLOS_EXPECTED_SOURCE: ${{ matrix.expected_source }}
        run: |
          python3 -m compileall -q restlos tests
          python3 -m unittest discover -s tests -v
          python3 -c 'import os; from restlos.package_managers import native_package_adapter; adapter=native_package_adapter(); assert adapter is not None and adapter.source.value == os.environ["RESTLOS_EXPECTED_SOURCE"], adapter'
